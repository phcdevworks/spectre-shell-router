name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.22.2
          - 24.15.0

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use pinned npm version
        # Install into a separate prefix: upgrading the bundled npm in place
        # can break mid-install (npm 10 deletes its own modules while running).
        run: |
          npm install -g --prefix "$RUNNER_TEMP/npm" "$(node -p "require('./package.json').packageManager")"
          echo "$RUNNER_TEMP/npm/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      - name: Run package checks
        run: npm run check
